server:
  port: 8084
spring:
  application:
    name: train-query-service
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: localhost
      port: 6379
    mongodb:
      uri: mongodb://localhost:27017/wimt
      auto-index-creation: true
  mongodb:
    uri: mongodb://localhost:27017/wimt
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      concurrency: 3
    consumer:
      group-id: train-query
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

query:
  # Station boards use the latest telemetry timestamp as "now" so the simulator demo works at any time of day.
  board:
    use-telemetry-clock: true

# Resilience4j protection of every Redis / MongoDB read (annotation driven)
resilience4j:
  circuitbreaker:
    instances:
      redisRead:
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      mongoRead:
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    instances:
      redisRead:
        maxAttempts: 3
        waitDuration: 50ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
      mongoRead:
        maxAttempts: 3
        waitDuration: 100ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
  bulkhead:
    instances:
      redisRead:
        maxConcurrentCalls: 100
        maxWaitDuration: 100ms
      mongoRead:
        maxConcurrentCalls: 30
        maxWaitDuration: 200ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,retries,bulkheads
  health:
    circuitbreakers:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
