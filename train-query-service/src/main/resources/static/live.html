<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Where Is My Train - live test console</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; max-width: 900px; }
    input, button { padding: 6px 10px; margin: 2px; }
    #status { padding: 10px; background: #eef; border-radius: 6px; margin: 10px 0; }
    pre { background: #111; color: #9f9; padding: 10px; height: 320px; overflow: auto; border-radius: 6px; font-size: 12px; }
  </style>
</head>
<body>
  <h2>Where Is My Train - live console</h2>
  <div>
    Train <input id="train" value="22895" size="6">
    Date <input id="date" size="10">
    <button onclick="connect()">Connect (STOMP/SockJS)</button>
    <button onclick="disconnectWs()">Disconnect</button>
    <button onclick="loadStatus()">Load running status</button>
  </div>
  <div id="status">not connected</div>
  <pre id="log"></pre>
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
  <script>
    document.getElementById('date').value = new Date().toISOString().slice(0, 10);
    let client = null;
    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('status');
    function log(msg) { logEl.textContent += msg + "\n"; logEl.scrollTop = logEl.scrollHeight; }
    function render(d) {
      statusEl.textContent = d.trainNumber + " | " + d.status + " | delay " + d.delayMinutes + " min | last " +
        d.lastCrossedStation + " -> next " + d.nextStation + " | " + (d.latitude ? d.latitude.toFixed(4) + "," + d.longitude.toFixed(4) : "");
    }
    function connect() {
      const train = document.getElementById('train').value, date = document.getElementById('date').value;
      if (client) client.deactivate();
      client = new StompJs.Client({
        webSocketFactory: () => new SockJS('/ws'),
        reconnectDelay: 3000,
        onConnect: () => {
          log('connected; subscribing to /topic/trains/' + train + '/' + date);
          client.subscribe('/topic/trains/' + train + '/' + date, m => {
            const d = JSON.parse(m.body); render(d);
            log(new Date().toLocaleTimeString() + ' delay=' + d.delayMinutes + ' changedStops=' + d.changedStops.length);
          });
        },
        onStompError: f => log('STOMP error: ' + f.headers['message'])
      });
      client.activate();
    }
    function disconnectWs() { if (client) client.deactivate(); log('disconnected'); }
    async function loadStatus() {
      const train = document.getElementById('train').value, date = document.getElementById('date').value;
      const r = await fetch('/api/v1/query/trains/' + train + '/running-status?journeyDate=' + date);
      log('GET running-status -> HTTP ' + r.status);
      if (r.ok) { const v = await r.json(); render(v); log(JSON.stringify(v, null, 1).slice(0, 1500)); }
    }
  </script>
</body>
</html>
