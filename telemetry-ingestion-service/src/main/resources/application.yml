server:
  port: 8081
spring:
  application:
    name: telemetry-ingestion-service
  threads:
    virtual:
      enabled: true
  datasource:
    # stringtype=unspecified lets Hibernate bind Strings into the JSONB outbox payload column
    url: jdbc:postgresql://localhost:5432/telemetry_db?stringtype=unspecified
    username: postgres
    password: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: telemetry-ingestion
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

simulator:
  enabled: true            # auto-start the live 22895 telemetry simulator
  train-number: "22895"
  tick-ms: 1000            # real time between pings
  step-seconds: 60         # simulated seconds advanced per tick (60x speed)
  initial-delay-seconds: 240

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
